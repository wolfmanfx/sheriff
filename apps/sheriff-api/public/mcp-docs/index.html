<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheriff MCP Server - Tools Documentation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen">
    <div class="bg-white/55 backdrop-blur supports-backdrop-filter:bg-white/40 border-b border-slate-200/70 shadow-[0_2px_12px_rgba(15,23,42,0.04)]">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <h1 class="text-3xl font-bold text-slate-800 tracking-tight">🔧 Sheriff MCP Server</h1>
        <p class="text-slate-500 mt-1 text-sm">Model Context Protocol Tools Documentation</p>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8">
      <div id="loading" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-slate-600"></div>
        <p class="mt-4 text-slate-600">Loading tools...</p>
      </div>

      <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4"></div>

      <div id="tools-container" class="hidden space-y-4"></div>
    </div>
  </div>

  <script>
    async function loadTools() {
      try {
        const response = await fetch('/mcp/tools', {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        renderTools(data.tools || []);
      } catch (error) {
        document.getElementById('loading').classList.add('hidden');
        const errorDiv = document.getElementById('error');
        errorDiv.classList.remove('hidden');
        errorDiv.textContent = `Failed to load tools: ${error instanceof Error ? error.message : String(error)}`;
      }
    }

    const toolMetadata = new Map();

    function renderTools(tools) {
      document.getElementById('loading').classList.add('hidden');
      const container = document.getElementById('tools-container');
      container.classList.remove('hidden');

      toolMetadata.clear();
      tools.forEach(tool => {
        const toolId = `tool-${tool.name.replace(/\./g, '-')}`;
        toolMetadata.set(toolId, {
          name: tool.name,
          properties: tool.inputSchema?.properties || {},
          required: tool.inputSchema?.required || []
        });
      });

      container.innerHTML = tools.map(tool => createToolCard(tool)).join('');
    }

    function createToolCard(tool) {
      const properties = tool.inputSchema?.properties || {};
      const required = tool.inputSchema?.required || [];
      const paramEntries = Object.entries(properties);
      const toolId = `tool-${tool.name.replace(/\./g, '-')}`;

      return `
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors" onclick="toggleTool('${toolId}', event)">
            <div class="flex items-center justify-between">
              <div class="flex-1">
                <h3 class="text-xl font-semibold text-slate-800 font-mono">${escapeHtml(tool.name)}</h3>
                <p class="text-sm text-slate-600 mt-1">${escapeHtml(tool.description || '')}</p>
              </div>
              <div class="text-slate-600 hover:text-slate-800 font-medium text-sm ml-4">
                <span class="expand-${toolId}">▼</span>
                <span class="collapse-${toolId} hidden">▲</span>
              </div>
            </div>
          </div>

          <div id="${toolId}" class="hidden">
            <div class="px-6 py-4 space-y-4">
              ${paramEntries.length > 0 ? `
                <div>
                  <h4 class="text-sm font-semibold text-slate-700 mb-3 uppercase tracking-wide">Parameters</h4>
                  <div class="space-y-2">
                    ${paramEntries.map(([name, schema]) => {
                      const typedSchema = schema || {};
                      return `
                        <div class="flex items-start gap-3 p-2 bg-slate-50 rounded">
                          <div class="flex-1">
                            <div class="flex items-center gap-2">
                              <span class="font-mono font-semibold text-slate-900">${escapeHtml(name)}</span>
                              <span class="text-xs px-2 py-0.5 bg-blue-100 text-blue-700 rounded">${escapeHtml(typedSchema.type || 'unknown')}</span>
                              ${required.includes(name) ? '<span class="text-xs px-2 py-0.5 bg-red-100 text-red-700 rounded">required</span>' : ''}
                            </div>
                            ${typedSchema.description ? `<p class="text-sm text-slate-600 mt-1">${escapeHtml(typedSchema.description)}</p>` : ''}
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : '<p class="text-sm text-slate-500 italic">No parameters required</p>'}

              <div class="border-t border-slate-200 pt-4">
                <h4 class="text-sm font-semibold text-slate-700 mb-3 uppercase tracking-wide">Try it out</h4>
                <form data-tool-name="${escapeHtml(tool.name)}" data-tool-id="${toolId}" onsubmit="return executeTool(event)" class="space-y-3">
                  ${paramEntries.map(([name, schema]) => {
                    const typedSchema = schema || {};
                    const inputType = typedSchema.type === 'array' ? 'textarea' : typedSchema.type === 'boolean' ? 'checkbox' : 'text';
                    return `
                      <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                          ${escapeHtml(name)}
                          ${required.includes(name) ? '<span class="text-red-500">*</span>' : ''}
                        </label>
                        ${inputType === 'textarea' ? `
                          <textarea name="${escapeHtml(name)}"
                            class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-slate-500 focus:border-slate-500 font-mono text-sm"
                            placeholder='["item1", "item2"]' rows="2"></textarea>
                        ` : inputType === 'checkbox' ? `
                          <input type="checkbox" name="${escapeHtml(name)}"
                            class="h-4 w-4 text-slate-600 focus:ring-slate-500 border-slate-300 rounded">
                        ` : `
                          <input type="text" name="${escapeHtml(name)}"
                            class="w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm focus:ring-slate-500 focus:border-slate-500 font-mono text-sm"
                            placeholder="${escapeHtml(typedSchema.description || '')}">
                        `}
                      </div>
                    `;
                  }).join('')}
                  <button type="submit"
                    class="w-full bg-slate-700 hover:bg-slate-800 text-white font-medium py-2 px-4 rounded-md shadow-sm transition focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
                    Execute
                  </button>
                </form>

                <div id="result-${toolId}" class="hidden mt-4">
                  <div class="bg-slate-900 rounded-md p-4">
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase">Response</span>
                      <button onclick="copyResult('result-${toolId}', event)" class="text-xs text-slate-400 hover:text-slate-200">Copy</button>
                    </div>
                    <pre id="result-content-${toolId}" class="text-green-400 text-sm overflow-x-auto whitespace-pre-wrap"></pre>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleTool(toolId, evt) {
      if (evt) {
        evt.preventDefault();
        evt.stopPropagation();
      }
      const tool = document.getElementById(toolId);
      const expand = document.querySelector(`.expand-${toolId}`);
      const collapse = document.querySelector(`.collapse-${toolId}`);

      if (!tool || !expand || !collapse) {
        return;
      }

      if (tool.classList.contains('hidden')) {
        tool.classList.remove('hidden');
        if (expand) expand.classList.add('hidden');
        if (collapse) collapse.classList.remove('hidden');
      } else {
        tool.classList.add('hidden');
        if (expand) expand.classList.remove('hidden');
        if (collapse) collapse.classList.add('hidden');
      }
    }

    async function executeTool(event) {
      event.preventDefault();
      event.stopPropagation();
      const form = event.target;
      const toolId = form.getAttribute('data-tool-id');
      const toolName = form.getAttribute('data-tool-name');

      const metadata = toolMetadata.get(toolId);
      if (!metadata) {
        alert('Tool metadata not found');
        return false;
      }

      const { properties, required } = metadata;
      const formData = new FormData(form);
      const args = {};

      for (const [key, value] of formData.entries()) {
        const prop = properties[key];
        if (!value && value !== '0' && value !== 0) continue;

        if (prop?.type === 'array') {
          try {
            args[key] = JSON.parse(value || '[]');
          } catch {
            args[key] = value ? value.split(',').map(s => s.trim()).filter(s => s) : [];
          }
        } else if (prop?.type === 'boolean') {
          args[key] = value === 'on' || value === true;
        } else if (prop?.type === 'number' || prop?.type === 'integer') {
          const num = Number(value);
          if (!isNaN(num)) args[key] = num;
        } else {
          args[key] = value;
        }
      }

      for (const req of required) {
        if (!args[req] && args[req] !== false && args[req] !== 0) {
          alert(`Required parameter "${req}" is missing`);
          return false;
        }
      }

      const resultDiv = document.getElementById(`result-${toolId}`);
      const resultContent = document.getElementById(`result-content-${toolId}`);

      resultDiv.classList.remove('hidden');
      resultContent.textContent = 'Executing...';

      try {
        const response = await fetch('/mcp/tools/call', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ name: toolName, arguments: args })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: `HTTP ${response.status}: ${response.statusText}` }));
          resultContent.textContent = JSON.stringify(errorData, null, 2);
          resultContent.className = 'text-red-400 text-sm overflow-x-auto whitespace-pre-wrap';
          return false;
        }

        const data = await response.json();

        if (data.isError) {
          const errorText = data.content?.[0]?.text;
          if (errorText) {
            try {
              const parsedError = JSON.parse(errorText);
              resultContent.textContent = JSON.stringify(parsedError, null, 2);
            } catch {
              resultContent.textContent = errorText;
            }
          } else {
            resultContent.textContent = JSON.stringify(data, null, 2);
          }
          resultContent.className = 'text-red-400 text-sm overflow-x-auto whitespace-pre-wrap';
        } else {
          const resultText = data.content?.[0]?.text;
          if (resultText) {
            try {
              const parsedResult = JSON.parse(resultText);
              // Check if the result contains treeText (for getAllFilesAsTreeText)
              if (parsedResult.treeText) {
                resultContent.textContent = parsedResult.treeText;
              } else {
                resultContent.textContent = JSON.stringify(parsedResult, null, 2);
              }
            } catch {
              resultContent.textContent = resultText;
            }
          } else {
            resultContent.textContent = JSON.stringify(data, null, 2);
          }
          resultContent.className = 'text-green-400 text-sm overflow-x-auto whitespace-pre-wrap';
        }
      } catch (error) {
        resultContent.textContent = `Network Error: ${error instanceof Error ? error.message : String(error)}`;
        resultContent.className = 'text-red-400 text-sm overflow-x-auto whitespace-pre-wrap';
      }
      return false;
    }

    function copyResult(resultId, evt) {
      const contentId = resultId.replace('result-', 'result-content-');
      const contentElement = document.getElementById(contentId);
      if (!contentElement) return;
      const content = contentElement.textContent;
      navigator.clipboard.writeText(content).then(() => {
        const btn = evt.target;
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = originalText, 2000);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadTools();
  </script>
</body>
</html>
